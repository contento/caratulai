# Caratulai Configuration
# See CLAUDE.md and README.md for full documentation
#
# Secrets (API keys) → .env
# Everything else → this file

cli:
  # Default tags for quick testing (comma-separated)
  default_tags: "prometheus,eagle,rock,fire,camel,lion,child"

  # Seed for generation (1–2147483647). Higher = more variation.
  seed: 16384

generation:
  # Canvas aspect ratio: square, 16:9, 4:3, 21:9, 9:16, 3:4
  ratio: "16:9"

  # Allow all SVG shapes (true = path, line, rect, circle, use, image, text, etc.)
  # false = restrict to fundamental shapes only
  allow_all_shapes: true

  # Image profile/style. Available profiles:
  # Pure aesthetics:   sagan | picasso | contento
  # Compositional:     dictionary
  # Psychological:     freud | jung | nietzsche
  # Epistemological:   booch | carlin | trumpa
  # Grounded:          rosina
  # Musical:           domingo
  # Literary:          gabriel
  profile: "sagan"

models:
  # Select which model set the CLI should use by default.
  active_set: "lmstudio"

  # Named model sets. CLI flags and env vars still override these values.
  sets:
    openrouter:
      # Text extraction (narrative → concept tags)
      text:
        provider: "openrouter"
        model: "deepseek/deepseek-v4-flash"
        api_key_env: "TEXT_MODEL_API_KEY"

      # SVG generation (tags → SVG)
      # Better models: meta-llama/llama-3.1-70b-instruct (capable), openai/gpt-4o
      svg:
        provider: "openrouter"
        model: "meta-llama/llama-3.1-70b-instruct"
        api_key_env: "SVG_MODEL_API_KEY"

      # Image reading (extract visual concepts) [Future: M6]
      image:
        provider: "openrouter"
        model: "openai/gpt-4o"
        api_key_env: "IMAGE_MODEL_API_KEY"

    lmstudio:
      # Local model set for LM Studio. Use a model that LM Studio can serve at :1234/v1.
      text:
        provider: "lmstudio"
        model: "qwen/qwen3.5-9b"
        base_url: "http://localhost:1234/v1"

      svg:
        provider: "lmstudio"
        model: "svgthinker-7b"
        base_url: "http://localhost:1234/v1"

      # Replace this with a vision-capable LM Studio model if you test --from-image locally.
      image:
        provider: "lmstudio"
        model: "google/gemma-4-12b-qat"
        base_url: "http://localhost:1234/v1"

output:
  # Auto-save directory for generated SVGs (with timestamp filenames)
  # Leave empty to disable. Format: {name_}{profile_}yyyyMMddHHmmss.svg
  # --name <label> adds an optional prefix; omit it to get profile_timestamp only.
  auto_save_dir: "./output"

palette:
  # Available: bw, grayscale, sepia, palette-16, palette-256
  default: "palette-256"
  # temperature: 0.7  # Optional: uncomment to override default

# Image generation profiles (styles)
# These mirror profiles.ts — the code is the source of truth.
profiles:
  # --- Pure aesthetics ---
  sagan:
    name: "Voyager Golden Record"
    description: "Gold background, silver marks. Engraved technical diagram, cosmic and archival."
    palette: "sagan"
    background_color: "#d4af37"
    max_elements: 48
    allow_all_shapes: false

  picasso:
    name: "Picasso Single Line"
    description: "One continuous flowing line suggests the entire form. Minimal, sophisticated."
    palette: "bw"
    background_color: "#ffffff"
    max_elements: 3
    allow_all_shapes: false

  contento:
    name: "Rich Complexity"
    description: "Maximalist layered composition. Fill the canvas — abundance, not chaos."
    palette: "palette-256"
    background_color: "#f5f5f5"
    max_elements: 80
    allow_all_shapes: true

  # --- Compositional ---
  dictionary:
    name: "Visual Dictionary"
    description: "Archetypal symbols and icons arranged as a pictographic lexicon."
    palette: "palette-256"
    background_color: "#ffffff"
    max_elements: 60
    allow_all_shapes: true

  # --- Psychological & philosophical ---
  freud:
    name: "Psychological Layers"
    description: "Concentric psyche diagram: Id (warm core) / Ego (middle) / Superego (cool outer)."
    palette: "grayscale-sepia"
    background_color: "#e8e8e8"
    max_elements: 70
    allow_all_shapes: false

  jung:
    name: "Archetypal Symbols"
    description: "Mandala with luminous Self at center, archetypal animals in radial symmetry."
    palette: "palette-256"
    background_color: "#fffaf0"
    max_elements: 60
    allow_all_shapes: true

  nietzsche:
    name: "Genealogy of Concepts"
    description: "Vertical genealogy: origin → Apollonian vs Dionysian branches → synthesis."
    palette: "palette-256"
    background_color: "#ffffff"
    max_elements: 100
    allow_all_shapes: true

  # --- Epistemological ---
  booch:
    name: "Engineering Clarity"
    description: "Rigorous system diagram (Booch style): components, connections, honest structure."
    palette: "booch"
    background_color: "#ffffff"
    max_elements: 70
    allow_all_shapes: false

  carlin:
    name: "Linguistic Subversion"
    description: "Sharp Carlin-style juxtaposition — expose contradictions, cut through comfortable lies."
    palette: "carlin"
    background_color: "#1a1a1a"
    max_elements: 80
    allow_all_shapes: true

  trumpa:
    name: "Sacred Paradox"
    description: "Crazy wisdom (Trungpa style): sacred and profane held together, playful depth."
    palette: "trumpa"
    background_color: "#f5e6d3"
    max_elements: 70
    allow_all_shapes: true

  # --- Grounded ---
  rosina:
    name: "Grounded Realism"
    description: "Italian neorealist: stark, unglamorous, essential — every line does work."
    palette: "rosina"
    background_color: "#d3d3d3"
    max_elements: 60
    allow_all_shapes: false

  # --- Musical & integrated ---
  domingo:
    name: "Musical Range"
    description: "Master tenor-baritone style: sweeping curves, high/low registers integrated."
    palette: "domingo"
    background_color: "#fef9f3"
    max_elements: 80
    allow_all_shapes: true

  # --- Literary & mythic ---
  gabriel:
    name: "Magic Realism"
    description: "García Márquez style: magical woven into mundane, warm, elaborate, mythic."
    palette: "gabriel"
    background_color: "#fffef5"
    max_elements: 120
    allow_all_shapes: true
